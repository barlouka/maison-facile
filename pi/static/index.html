<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maison">
<meta name="theme-color" content="#0c0a18">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Maison</title>
<style>
  /* Couleurs animables (transition douce du fond quand on change d'onglet) */
  @property --c1 { syntax: "<color>"; inherits: true; initial-value: #7b5cff; }
  @property --c2 { syntax: "<color>"; inherits: true; initial-value: #ff4d8d; }

  :root {
    --bg: #0c0a18; --glass: rgba(255,255,255,.07); --glass2: rgba(255,255,255,.12);
    --line: rgba(255,255,255,.09); --text: #fbf8ff; --muted: rgba(240,235,255,.6);
    --r: 22px; --ease: cubic-bezier(.2,.9,.3,1.15);
    --g-qobuz: linear-gradient(135deg, #7b5cff, #3b82f6);
    --g-radio: linear-gradient(135deg, #ff8a4c, #ff3d77);
    --g-podcast: linear-gradient(135deg, #2dd4a0, #0ea5c6);
    --g-tv: linear-gradient(135deg, #8b5cf6, #ec4899);
    --g-light: linear-gradient(135deg, #ffd166, #ff8f3c);
    --g-store: linear-gradient(135deg, #38bdf8, #6366f1);
    --g-off: linear-gradient(135deg, #ff5e62, #c026d3);
    --c1: #7b5cff; --c2: #ff4d8d;
    transition: --c1 1.2s ease, --c2 1.2s ease;
  }
  body[data-tab="music"]  { --c1: #7b5cff; --c2: #ff4d8d; }
  body[data-tab="tv"]     { --c1: #8b5cf6; --c2: #ec4899; }
  body[data-tab="lights"] { --c1: #ff9f43; --c2: #ffd166; }
  body[data-tab="stores"] { --c1: #38bdf8; --c2: #6366f1; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 17px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Rounded", "SF Pro Text", "Inter", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overflow: hidden; }
  body { display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left); }
  svg { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* Fond aurore animé (transformations seulement : fluide même sur le Pi) */
  .aurora { position: fixed; inset: -20%; z-index: -1; pointer-events: none; }
  .aurora i { position: absolute; width: 70vmax; height: 70vmax; border-radius: 50%; opacity: .38; will-change: transform; }
  .aurora i:nth-child(1) { background: radial-gradient(circle, var(--c1), transparent 62%); top: -10%; left: -10%;
    animation: drift1 22s ease-in-out infinite alternate; }
  .aurora i:nth-child(2) { background: radial-gradient(circle, var(--c2), transparent 62%); bottom: -15%; right: -10%;
    animation: drift2 26s ease-in-out infinite alternate; }
  .aurora i:nth-child(3) { background: radial-gradient(circle, #22d3ee, transparent 60%); top: 40%; left: 30%;
    width: 45vmax; height: 45vmax; opacity: .16; animation: drift3 30s ease-in-out infinite alternate; }
  @keyframes drift1 { to { transform: translate(18vw, 14vh) scale(1.15); } }
  @keyframes drift2 { to { transform: translate(-16vw, -12vh) scale(1.2); } }
  @keyframes drift3 { to { transform: translate(-20vw, 10vh) scale(.85); } }

  header { display: flex; align-items: center; justify-content: space-between; padding: 18px 20px 6px; gap: 12px; }
  header h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.6px;
    background: linear-gradient(90deg, #fff, color-mix(in srgb, var(--c2) 55%, #fff));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  #now { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 62%;
    padding: 7px 12px 7px 10px; border-radius: 99px; background: var(--glass); border: 1px solid var(--line);
    font-size: 14px; color: var(--text); opacity: 0; transform: translateY(-6px); transition: .4s var(--ease); }
  #now.show { opacity: 1; transform: none; }
  #now span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
  .eq b { width: 3px; border-radius: 2px; background: linear-gradient(var(--c2), var(--c1)); animation: eq .9s ease-in-out infinite; }
  .eq b:nth-child(2) { animation-delay: -.3s; } .eq b:nth-child(3) { animation-delay: -.6s; } .eq b:nth-child(4) { animation-delay: -.15s; }
  @keyframes eq { 0%,100% { height: 25%; } 50% { height: 100%; } }

  nav { display: flex; gap: 8px; padding: 10px 20px; position: relative; }
  nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px 8px; border: 1px solid var(--line); border-radius: 16px; background: var(--glass);
    color: var(--muted); font: inherit; font-weight: 700; font-size: 15px;
    transition: color .3s, background .4s, transform .2s var(--ease), box-shadow .4s; }
  nav button svg { font-size: 19px; }
  nav button:active { transform: scale(.94); }
  nav button.on { color: #fff; border-color: transparent; }
  nav button[data-tab="music"].on  { background: var(--g-qobuz);  box-shadow: 0 8px 24px -8px #7b5cffaa; }
  nav button[data-tab="tv"].on     { background: var(--g-tv);     box-shadow: 0 8px 24px -8px #ec4899aa; }
  nav button[data-tab="lights"].on { background: var(--g-light);  box-shadow: 0 8px 24px -8px #ff8f3caa; color: #3a1d00; }
  nav button[data-tab="stores"].on { background: var(--g-store);  box-shadow: 0 8px 24px -8px #38bdf8aa; }

  main { flex: 1; overflow-y: auto; padding: 8px 20px 24px; -webkit-overflow-scrolling: touch; }
  section { display: none; }
  section.on { display: block; animation: sectionIn .45s var(--ease); }
  @keyframes sectionIn { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  section.on .pop { animation: popIn .5s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms); }
  @keyframes popIn { from { opacity: 0; transform: translateY(16px) scale(.92); } }

  h2 { display: flex; align-items: center; gap: 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.4px;
    color: var(--muted); font-weight: 800; margin: 22px 2px 10px; }
  h2::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dot, var(--c2));
    box-shadow: 0 0 10px var(--dot, var(--c2)); }
  h2:first-child { margin-top: 6px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

  /* Tuiles colorées */
  .tile { position: relative; overflow: hidden; border: 0; border-radius: var(--r); color: #fff;
    font: inherit; font-weight: 800; font-size: 17px; padding: 16px; min-height: 108px; text-align: left;
    display: flex; flex-direction: column; justify-content: space-between; gap: 10px;
    background: var(--g, var(--glass2)); box-shadow: 0 10px 26px -14px var(--sh, #0008);
    transition: transform .25s var(--ease), filter .2s; isolation: isolate; }
  .tile::before { content: ""; position: absolute; width: 120px; height: 120px; border-radius: 50%;
    right: -36px; top: -44px; background: rgba(255,255,255,.16); z-index: -1; transition: transform .6s var(--ease); }
  .tile::after { content: ""; position: absolute; width: 70px; height: 70px; border-radius: 50%;
    right: 30px; bottom: -40px; background: rgba(255,255,255,.08); z-index: -1; }
  .tile:active { transform: scale(.95); filter: brightness(1.12); }
  .tile:active::before { transform: scale(1.4); }
  .tile .ic { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center;
    background: rgba(255,255,255,.22); font-size: 21px; }
  .tile small { display: block; color: rgba(255,255,255,.78); font-weight: 600; font-size: 13px; margin-top: 2px; }
  .tile .eq { position: absolute; right: 16px; top: 18px; height: 18px; opacity: 0; transition: opacity .3s; }
  .tile .eq b { background: #fff; width: 4px; }
  .tile.playing .eq { opacity: 1; }
  .tile.playing { box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 14px 34px -12px var(--sh); }
  .t-qobuz { --g: var(--g-qobuz); --sh: #5b6cff; }
  .t-radio { --g: var(--g-radio); --sh: #ff4d6d; }
  .t-podcast { --g: var(--g-podcast); --sh: #14b8a6; }
  .t-tv { --g: var(--g-tv); --sh: #c04bdc; }
  .t-light { --g: var(--g-light); --sh: #ff9f43; color: #3a1d00; }
  .t-light small { color: #6b3a00; } .t-light .ic { background: rgba(255,255,255,.4); }
  .t-glass { --g: var(--glass2); --sh: transparent; border: 1px solid var(--line); }
  .tile.big { grid-column: 1 / -1; min-height: 128px; font-size: 24px; }
  .tile.big .ic { width: 52px; height: 52px; font-size: 27px; border-radius: 16px; }

  /* Épisodes de podcast */
  .list .row { display: flex; align-items: center; gap: 14px; background: var(--glass); border: 1px solid var(--line);
    border-radius: 18px; padding: 12px 12px 12px 16px; margin-bottom: 8px; }
  .row .t { flex: 1; min-width: 0; }
  .row .t div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
  .row .t small { color: var(--muted); }
  .play { border: 0; width: 48px; height: 48px; border-radius: 50%; background: var(--g-podcast);
    color: #fff; font-size: 20px; display: grid; place-items: center; flex: none;
    box-shadow: 0 6px 16px -6px #14b8a6; transition: transform .2s var(--ease); }
  .play:active { transform: scale(.88); }

  /* Lumières : la carte s'illumine selon l'intensité */
  .room { position: relative; overflow: hidden; border-radius: var(--r); padding: 16px 18px; margin-bottom: 12px;
    background: var(--glass); border: 1px solid var(--line); isolation: isolate; transition: border-color .4s; }
  .room::before { content: ""; position: absolute; inset: 0; z-index: -1; background: var(--g-light);
    opacity: calc(var(--on, 0) * (.25 + var(--b, 1) * .75)); transition: opacity .5s ease; }
  .room::after { content: ""; position: absolute; width: 160px; height: 160px; border-radius: 50%; top: -70px; left: -40px;
    background: radial-gradient(circle, #fff8 0, transparent 65%); z-index: -1;
    opacity: calc(var(--on, 0) * var(--b, 1)); transition: opacity .5s; }
  .room.on { color: #3a1d00; border-color: transparent; }
  .room .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 12px; }
  .room .name { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 19px; }
  .room .bulb { font-size: 22px; transition: transform .4s var(--ease); }
  .room.on .bulb { transform: rotate(-12deg) scale(1.1); filter: drop-shadow(0 0 6px #fff); }
  .switch { width: 64px; height: 36px; border-radius: 18px; border: 0; background: rgba(255,255,255,.15);
    position: relative; transition: background .3s; flex: none; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 28px; height: 28px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 6px #0004; transition: left .35s var(--ease); }
  .room.on .switch { background: rgba(58,29,0,.35); }
  .room.on .switch::after { left: 32px; }
  input[type=range] { --p: 50%; width: 100%; height: 44px; -webkit-appearance: none; appearance: none; background: transparent; }
  input[type=range]::-webkit-slider-runnable-track { height: 12px; border-radius: 6px;
    background: linear-gradient(90deg, #fff var(--p), rgba(255,255,255,.18) var(--p)); }
  .room.on input[type=range]::-webkit-slider-runnable-track {
    background: linear-gradient(90deg, #3a1d00cc var(--p), rgba(58,29,0,.18) var(--p)); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -9px;
    border-radius: 50%; background: #fff; box-shadow: 0 2px 8px #0005; }

  /* Stores : petit store qui monte et descend */
  .store { display: flex; align-items: center; gap: 12px; background: var(--glass); border: 1px solid var(--line);
    border-radius: var(--r); padding: 12px 12px 12px 14px; margin-bottom: 10px; }
  .store.all { background: linear-gradient(135deg, #38bdf833, #6366f133); }
  .blind { width: 46px; height: 46px; border-radius: 12px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(#bfe6ff, #7dd3fc 60%, #a7f3d0); border: 2px solid rgba(255,255,255,.35); }
  .blind::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: var(--h, 15%);
    background: repeating-linear-gradient(#6366f1 0 5px, #4f46e5 5px 7px);
    transition: height var(--dur, 1.6s) cubic-bezier(.45,.05,.35,1); box-shadow: 0 2px 4px #0005; }
  .store .name { flex: 1; font-weight: 800; font-size: 18px; }
  .store button { width: 56px; height: 52px; border-radius: 15px; border: 0; background: rgba(255,255,255,.1);
    color: var(--text); font-size: 22px; display: grid; place-items: center; transition: transform .2s var(--ease), background .2s; }
  .store button:active { transform: scale(.88); background: var(--g-store); }

  /* Télécommande Apple TV */
  .remote { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 360px; margin: 0 auto; }
  .remote button { border: 1px solid var(--line); border-radius: 22px; background: var(--glass); color: var(--text);
    font: inherit; font-size: 26px; height: 80px; display: grid; place-items: center;
    transition: transform .18s var(--ease), background .2s; }
  .remote button:active { transform: scale(.9); background: var(--glass2); }
  .remote .ok { border: 0; border-radius: 50%; aspect-ratio: 1; height: auto; width: 86%; justify-self: center;
    background: var(--g-tv); font-size: 18px; font-weight: 900; box-shadow: 0 10px 26px -10px #c04bdc; }
  .remote .lbl { font-size: 15px; font-weight: 700; }

  /* Barre du bas */
  footer { display: flex; align-items: center; gap: 10px; padding: 12px 20px calc(12px + env(safe-area-inset-bottom));
    background: rgba(8,7,16,.72); border-top: 1px solid var(--line); }
  footer button { border: 1px solid var(--line); border-radius: 16px; background: var(--glass); color: var(--text);
    font: inherit; font-weight: 800; height: 54px; min-width: 56px; font-size: 22px; display: grid; place-items: center;
    transition: transform .2s var(--ease), background .3s; }
  footer button:active { transform: scale(.9); }
  #vol { flex: 1; text-align: center; padding: 0 6px; }
  #vol b { font-size: 24px; display: inline-block; font-variant-numeric: tabular-nums; }
  #vol b.bump { animation: bump .3s var(--ease); }
  @keyframes bump { 50% { transform: scale(1.25); } }
  .vbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); margin-top: 6px; overflow: hidden; }
  .vbar i { display: block; height: 100%; width: 0; border-radius: 3px; background: linear-gradient(90deg, var(--c1), var(--c2));
    transition: width .35s var(--ease); }
  #mute.on { background: var(--g-off); border-color: transparent; }
  #off { background: var(--g-off); border: 0; color: #fff; font-size: 14px; padding: 0 14px; gap: 2px;
    box-shadow: 0 8px 20px -10px #ff5e62; display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
  #off svg { font-size: 18px; }

  #toast { position: fixed; left: 50%; bottom: 112px; transform: translate(-50%, 30px) scale(.9);
    background: linear-gradient(135deg, var(--c1), var(--c2)); color: #fff; padding: 12px 20px; border-radius: 99px;
    font-size: 15px; font-weight: 700; opacity: 0; transition: .4s var(--ease); pointer-events: none;
    max-width: 90%; text-align: center; z-index: 5; box-shadow: 0 12px 30px -10px #000c; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.err { background: linear-gradient(135deg, #ff5e62, #b91c1c); }

  /* Téléphone (portrait) */
  @media (max-width: 480px) {
    header { padding: 14px 16px 4px; }
    nav { padding: 8px 16px; gap: 6px; }
    nav button { min-width: 0; flex-direction: column; gap: 3px; padding: 9px 4px; font-size: 12px; }
    nav button svg { font-size: 21px; }
    main { padding: 6px 16px 22px; }
    footer { padding-left: 16px; padding-right: 16px; gap: 8px; }
    footer button { min-width: 50px; height: 52px; }
    #off { font-size: 11.5px; padding: 0 10px; }
    .store { gap: 8px; padding: 10px; }
    .store button { width: 46px; height: 48px; font-size: 20px; }
    .store .name { font-size: 16px; }
    .blind { width: 40px; height: 40px; }
  }

  /* Petits écrans en paysage (écran tactile du Pi) : onglets à gauche */
  @media (orientation: landscape) and (max-height: 620px) {
    body { display: grid; grid-template-columns: 178px 1fr; grid-template-rows: auto 1fr auto;
      grid-template-areas: "head main" "nav main" "foot foot"; }
    header { grid-area: head; flex-direction: column; align-items: flex-start; padding: 14px 14px 4px; gap: 6px; }
    header h1 { font-size: 24px; }
    #now { max-width: 100%; font-size: 12px; }
    nav { grid-area: nav; flex-direction: column; padding: 8px 14px; }
    nav button { flex: none; justify-content: flex-start; padding: 13px 14px; font-size: 16px; }
    main { grid-area: main; padding: 14px 16px 14px 4px; }
    footer { grid-area: foot; padding: 8px 14px; }
    footer button { height: 50px; }
    .tile { min-height: 92px; padding: 13px; font-size: 16px; }
    .tile .ic { width: 34px; height: 34px; font-size: 18px; border-radius: 11px; }
    .tile.big { min-height: 96px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .remote { max-width: 300px; gap: 8px; }
    .remote button { height: 60px; }
    h2 { margin: 16px 2px 8px; }
  }

  /* Horloge au repos */
  #clock { position: fixed; inset: 0; background: #000; display: flex; flex-direction: column;
    align-items: center; justify-content: center; z-index: 10; opacity: 0; pointer-events: none; transition: opacity .8s; }
  #clock.show { opacity: 1; pointer-events: auto; }
  #clock .h { font: 200 min(30vw, 46vh)/1 -apple-system, "SF Pro Rounded", system-ui;
    letter-spacing: -4px; font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ffb347, #ff5f8f, #a78bfa, #ffb347); background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 18s linear infinite; }
  #clock .h i { font-style: normal; animation: blink 2s steps(1) infinite; }
  @keyframes shimmer { to { background-position: 300% 0; } }
  @keyframes blink { 50% { opacity: .25; } }
  #clock .d { margin-top: 2vh; color: #77737f; font-size: min(5vw, 4.5vh); font-weight: 500; }
  #clock .d::first-letter { text-transform: uppercase; }
  #clock .s { color: #34323a; margin-top: 4vh; font-size: 14px; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition-duration: .01s !important; }
  }
</style>
</head>
<body data-tab="music">
<div class="aurora"><i></i><i></i><i></i></div>

<header>
  <h1 id="title">Maison</h1>
  <div id="now"><span class="eq"><b></b><b></b><b></b><b></b></span><span></span></div>
</header>

<nav>
  <button data-tab="music" class="on"><svg data-i="music"></svg>Musique</button>
  <button data-tab="tv"><svg data-i="tv"></svg>TV</button>
  <button data-tab="lights"><svg data-i="bulb"></svg>Lumières</button>
  <button data-tab="stores"><svg data-i="blinds"></svg>Stores</button>
</nav>

<main>
  <section id="music" class="on">
    <h2 id="h-presets" style="--dot:#7b8cff">Qobuz</h2>
    <div class="grid" id="presets"></div>
    <h2 id="h-radios" style="--dot:#ff6b6b">Radio</h2>
    <div class="grid" id="radios"></div>
    <h2 id="h-podcasts" style="--dot:#2dd4a0">Podcasts</h2>
    <div class="grid" id="podcasts"></div>
    <div class="list" id="episodes"></div>
    <h2 style="--dot:#fff">Lecture</h2>
    <div class="grid" id="transport"></div>
  </section>

  <section id="tv">
    <div class="grid" id="tvtiles"></div>
    <h2 style="--dot:#ec4899">Télécommande</h2>
    <div class="remote">
      <button class="lbl pop" style="--i:1" onclick="key('menu')">Retour</button>
      <button class="pop" style="--i:2" onclick="key('up')"><svg data-i="up"></svg></button>
      <button class="lbl pop" style="--i:3" onclick="key('home')">Accueil</button>
      <button class="pop" style="--i:4" onclick="key('left')"><svg data-i="left"></svg></button>
      <button class="ok pop" style="--i:5" onclick="key('select')">OK</button>
      <button class="pop" style="--i:6" onclick="key('right')"><svg data-i="right"></svg></button>
      <button class="pop" style="--i:7" onclick="key('previous')"><svg data-i="prev"></svg></button>
      <button class="pop" style="--i:8" onclick="key('down')"><svg data-i="down"></svg></button>
      <button class="pop" style="--i:9" onclick="key('next')"><svg data-i="next"></svg></button>
      <span></span>
      <button class="pop" style="--i:10" onclick="key('playpause')"><svg data-i="playpause"></svg></button>
      <span></span>
    </div>
  </section>

  <section id="lights">
    <div class="grid" id="lighttiles" style="margin-bottom:14px"></div>
    <div id="rooms"></div>
  </section>

  <section id="stores">
    <div id="storelist"></div>
  </section>
</main>

<footer>
  <button onclick="vol(-1)" aria-label="Baisser"><svg data-i="minus"></svg></button>
  <div id="vol"><b>–</b><div class="vbar"><i></i></div></div>
  <button onclick="vol(1)" aria-label="Monter"><svg data-i="plus"></svg></button>
  <button id="mute" onclick="mute()" aria-label="Couper le son"><svg data-i="mute"></svg></button>
  <button id="off" onclick="allOff()"><svg data-i="power"></svg>Tout éteindre</button>
</footer>

<div id="toast"></div>
<div id="clock"><div class="h">--:--</div><div class="d"></div><div class="s">Touchez l'écran</div></div>

<script>
// Icônes (SVG dessinés à la main : aucune police ni emoji requis sur le Pi)
const ICONS = {
  music: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  disc: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/><path d="M12 3a9 9 0 0 1 9 9"/>',
  radio: '<rect x="3" y="8" width="18" height="12" rx="3"/><path d="M7 8 17 3"/><circle cx="15.5" cy="14" r="2.5"/><path d="M6.5 12.5h3M6.5 15.5h3"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  tv: '<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="M8 21h8M12 17v4"/>',
  bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3Z"/>',
  blinds: '<path d="M4 3h16M5 3v13M19 3v13M5 7h14M5 11h14M5 15h14"/><path d="M12 16v3"/><circle cx="12" cy="20.5" r="1.2"/>',
  power: '<path d="M12 3v8"/><path d="M6.4 6.6a8 8 0 1 0 11.2 0"/>',
  minus: '<path d="M5 12h14"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  mute: '<path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="m22 9-6 6M16 9l6 6"/>',
  play: '<path d="M7 4v16l13-8Z" fill="currentColor"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/>',
  playpause: '<path d="M4 5v14l8-7Z" fill="currentColor"/><path d="M15 5v14M20 5v14"/>',
  up: '<path d="m6 15 6-6 6 6"/>', down: '<path d="m6 9 6 6 6-6"/>', left: '<path d="m15 6-6 6 6 6"/>', right: '<path d="m9 6 6 6-6 6"/>',
  prev: '<path d="M19 5 9 12l10 7Z" fill="currentColor"/><path d="M5 5v14"/>', next: '<path d="m5 5 10 7-10 7Z" fill="currentColor"/><path d="M19 5v14"/>',
  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  pause: '<path d="M8 5v14M16 5v14"/>', apple: '<rect x="3" y="5" width="18" height="12" rx="2.5"/><path d="m10 9 5 2-5 2Z" fill="currentColor"/><path d="M8 21h8"/>',
};
const icon = n => `<svg viewBox="0 0 24 24">${ICONS[n] || ""}</svg>`;
document.querySelectorAll("svg[data-i]").forEach(s => { s.setAttribute("viewBox", "0 0 24 24"); s.innerHTML = ICONS[s.dataset.i]; });

let CONF = {}, STATE = {}, PLAYING_TILE = null;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const buzz = () => navigator.vibrate && navigator.vibrate(8);

function toast(msg, err) {
  const t = $("#toast"); t.textContent = msg; t.className = "show" + (err ? " err" : "");
  clearTimeout(t._h); t._h = setTimeout(() => t.className = "", err ? 4000 : 1700);
}

async function api(path, body) {
  try {
    const r = await fetch("/api/" + path, {
      method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body || {})
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.status);
    return j;
  } catch (e) { toast("Oups : " + e.message, true); throw e; }
}
async function get(path) {
  const r = await fetch("/api/" + path); const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status); return j;
}

// Onglets
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  buzz();
  document.querySelectorAll("nav button, section").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); $("#" + b.dataset.tab).classList.add("on");
  document.body.dataset.tab = b.dataset.tab;
  $("main").scrollTop = 0;
  if (b.dataset.tab === "lights") refresh();
});

function tile(cls, ic, label, sub, onclick, i) {
  const b = document.createElement("button");
  b.className = `tile pop ${cls}`; b.style.setProperty("--i", i || 0);
  b.innerHTML = `<span class="ic">${icon(ic)}</span><span>${esc(label)}${sub ? `<small>${esc(sub)}</small>` : ""}</span>
    <span class="eq"><b></b><b></b><b></b><b></b></span>`;
  b.onclick = () => { buzz(); onclick(b); };
  return b;
}

function markPlaying(el) {
  if (PLAYING_TILE) PLAYING_TILE.classList.remove("playing");
  PLAYING_TILE = el; if (el) el.classList.add("playing");
}
async function playing(p, label, el) {
  try { await p; markPlaying(el); toast("♪ " + label); setTimeout(refresh, 1500); } catch {}
}

function buildMusic() {
  let i = 0;
  const pr = $("#presets"); pr.innerHTML = "";
  (CONF.presets || []).forEach(p => pr.append(tile("t-qobuz", "disc", p.name, p.sub || "Qobuz",
    el => playing(api("preset", {preset: p.preset}), p.name, el), i++)));
  $("#h-presets").style.display = pr.children.length ? "" : "none";

  const ra = $("#radios"); ra.innerHTML = "";
  (CONF.radios || []).forEach((r, k) => ra.append(tile("t-radio", "radio", r.name, r.sub || "Radio",
    el => playing(api("radio", {index: k}), r.name, el), i++)));
  $("#h-radios").style.display = ra.children.length ? "" : "none";

  const po = $("#podcasts"); po.innerHTML = "";
  (CONF.podcasts || []).forEach(p => po.append(tile("t-podcast", "mic", p.name, "Derniers épisodes", el => episodes(p, el), i++)));
  $("#h-podcasts").style.display = po.children.length ? "" : "none";

  const tr = $("#transport"); tr.innerHTML = "";
  tr.append(tile("t-glass", "pause", "Pause / reprise", "", () => api("wiim/pause"), i++));
  tr.append(tile("t-glass", "stop", "Arrêter", "", () => api("wiim/stop").then(() => { markPlaying(null); refresh(); }), i++));
}

async function episodes(p, srcTile) {
  const box = $("#episodes"); box.innerHTML = `<div class="row"><div class="t"><small>Chargement…</small></div></div>`;
  try {
    const eps = await get("podcast?i=" + p.index);
    box.innerHTML = `<h2 style="--dot:#2dd4a0">${esc(p.name)}</h2>`;
    eps.forEach((e, k) => {
      const row = document.createElement("div"); row.className = "row pop"; row.style.setProperty("--i", k);
      row.innerHTML = `<div class="t"><div>${esc(e.title)}</div><small>${esc(e.date)}</small></div><button class="play">${icon("play")}</button>`;
      row.querySelector("button").onclick = () => { buzz(); playing(api("listen", {url: e.url}), e.title, srcTile); };
      box.append(row);
    });
    box.scrollIntoView({behavior: "smooth", block: "nearest"});
  } catch (e) { box.innerHTML = ""; toast("Podcast indisponible", true); }
}

function buildTV() {
  const t = $("#tvtiles"); t.innerHTML = "";
  const big = tile("t-tv big", "apple", "Apple TV", "Allume tout et met la bonne entrée", () => watch(false), 0);
  t.append(big);
  if (CONF.qobuz) t.append(tile("t-qobuz", "disc", "Qobuz sur la TV", "Ouvre l'app Qobuz", () => watch(true), 1));
}

function buildLightTiles() {
  const t = $("#lighttiles"); t.innerHTML = "";
  t.append(tile("t-glass", "moon", "Tout éteindre", "Toutes les lumières", () => api("lights/off").then(() => {
    document.querySelectorAll(".room").forEach(r => { r.classList.remove("on"); r.style.setProperty("--on", 0); });
    toast("Lumières éteintes"); setTimeout(refresh, 800);
  }), 0));
}

const BLIND = {};  // dernière position connue de chaque store (visuel)
function buildStores() {
  const box = $("#storelist"); box.innerHTML = "";
  const list = CONF.stores || [];
  if (!list.length) { box.innerHTML = `<p style="color:var(--muted)">Aucun store configuré.</p>`; return; }
  [{name: "Tous les stores", id: "all"}, ...list].forEach((s, k) => {
    const row = document.createElement("div"); row.className = "store pop" + (s.id === "all" ? " all" : "");
    row.style.setProperty("--i", k); row.dataset.id = s.id;
    row.innerHTML = `<div class="blind"></div><div class="name">${esc(s.name)}</div>
      <button>${icon("up")}</button><button>${icon("pause")}</button><button>${icon("down")}</button>`;
    const bl = row.querySelector(".blind");
    if (BLIND[s.id]) bl.style.setProperty("--h", BLIND[s.id]);
    const [u, st, d] = row.querySelectorAll("button");
    const move = (action, h) => {
      buzz();
      const targets = s.id === "all" ? document.querySelectorAll(".store .blind") : [bl];
      targets.forEach(x => {
        if (h === null) { // stop : on fige le store là où il est
          const cur = getComputedStyle(x, "::before").height, tot = x.clientHeight;
          x.style.setProperty("--dur", "0s"); x.style.setProperty("--h", (parseFloat(cur) / tot * 100) + "%");
        } else { x.style.setProperty("--dur", "1.6s"); x.style.setProperty("--h", h); }
        BLIND[x.closest(".store").dataset.id] = x.style.getPropertyValue("--h");
      });
      api("store", {id: s.id, action});
    };
    u.onclick = () => move("up", "12%");
    st.onclick = () => move("idle", null);
    d.onclick = () => move("down", "92%");
    box.append(row);
  });
}

function buildRooms(rooms) {
  const box = $("#rooms");
  if (!Array.isArray(rooms)) { box.innerHTML = `<p style="color:var(--muted)">Lumières injoignables.</p>`; return; }
  if (box._busy) return;
  const first = !box.children.length;
  box.innerHTML = "";
  rooms.forEach((r, k) => {
    const el = document.createElement("div"); el.className = "room" + (first ? " pop" : "") + (r.on ? " on" : "");
    el.style.setProperty("--i", k + 1);
    const pct = v => (v / 254 * 100).toFixed(1) + "%";
    const paint = (on, bri) => {
      el.classList.toggle("on", on); el.style.setProperty("--on", on ? 1 : 0);
      el.style.setProperty("--b", (bri / 254).toFixed(2)); sl.style.setProperty("--p", pct(bri));
    };
    el.innerHTML = `<div class="top"><div class="name"><span class="bulb">${icon("bulb")}</span>${esc(r.name)}</div>
      <button class="switch" aria-label="Allumer ou éteindre"></button></div>
      <input type="range" min="1" max="254" value="${r.bri}">`;
    const sw = el.querySelector(".switch"), sl = el.querySelector("input");
    paint(r.on, r.bri);
    sw.onclick = () => { buzz(); const on = !el.classList.contains("on"); paint(on, +sl.value); api("lights/room", {id: r.id, on}); };
    sl.oninput = () => { box._busy = true; paint(true, +sl.value); };
    sl.onchange = () => { api("lights/room", {id: r.id, bri: +sl.value}); setTimeout(() => box._busy = false, 1500); };
    box.append(el);
  });
}

// Volume (Denon)
function showVol(bump) {
  const d = STATE.denon || {}, b = $("#vol b");
  b.textContent = d.error ? "!" : (d.power ? (d.volume ?? "–") : "Éteint");
  if (bump) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
  const pct = d.power && typeof d.volume === "number" ? Math.min(100, d.volume / (d.max_volume || 70) * 100) : 0;
  $(".vbar i").style.width = pct + "%";
  $("#mute").classList.toggle("on", !!d.mute);
}
let volTimer;
function vol(step) {
  buzz();
  const d = STATE.denon || {};
  if (typeof d.volume === "number") { d.volume = Math.max(0, Math.min(d.max_volume || 70, d.volume + step)); showVol(true); }
  api("denon/volume", {step});
  clearTimeout(volTimer); volTimer = setTimeout(refresh, 1200);
}
function mute() { buzz(); const on = !(STATE.denon || {}).mute; (STATE.denon ||= {}).mute = on; showVol(); api("denon/mute", {on}); }

async function watch(qobuz) { try { await api("appletv/watch", {qobuz}); toast("Apple TV prête"); } catch {} }
function key(k) { buzz(); api("appletv/key", {key: k}); }

async function allOff() {
  if (!confirm("Tout éteindre (musique, TV, ampli, lumières) ?")) return;
  try { await api("off"); markPlaying(null); toast("Bonne nuit"); setTimeout(refresh, 2000); } catch {}
}

async function refresh() {
  try {
    STATE = await get("status");
    showVol();
    const w = STATE.wiim || {}, now = $("#now");
    const on = w.state === "play" && w.title;
    now.classList.toggle("show", !!on);
    if (on) now.lastElementChild.textContent = w.title;
    if (!on && w.state && PLAYING_TILE) markPlaying(null);
    buildRooms(STATE.lights);
  } catch {}
}

// Horloge au repos (sur l'écran du Pi, la luminosité baisse aussi)
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
function screen(on) { if (LOCAL) fetch("/api/screen", {method: "POST", body: JSON.stringify({on})}).catch(() => {}); }
let idle;
function tick() {
  const n = new Date();
  const [h, m] = n.toLocaleTimeString("fr-CH", {hour: "2-digit", minute: "2-digit"}).split(":");
  $("#clock .h").innerHTML = `${h}<i>:</i>${m}`;
  $("#clock .d").textContent = n.toLocaleDateString("fr-CH", {weekday: "long", day: "numeric", month: "long"});
}
function wake(e) {
  const c = $("#clock");
  if (c.classList.contains("show")) { c.classList.remove("show"); e && e.preventDefault(); screen(true); refresh(); }
  clearTimeout(idle);
  if (CONF.idle_seconds > 0) idle = setTimeout(() => { tick(); c.classList.add("show"); screen(false); }, CONF.idle_seconds * 1000);
}
["pointerdown", "keydown"].forEach(ev => document.addEventListener(ev, wake, true));
setInterval(() => { if ($("#clock").classList.contains("show")) tick(); }, 10000);

(async function init() {
  try { CONF = await get("config"); } catch { toast("Serveur injoignable", true); return; }
  $("#title").textContent = CONF.title || "Maison"; document.title = CONF.title || "Maison";
  buildMusic(); buildTV(); buildLightTiles(); buildStores(); refresh(); wake();
  setInterval(() => { if (!document.hidden && !$("#clock").classList.contains("show")) refresh(); }, 8000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
